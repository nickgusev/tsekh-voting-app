<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цех историй</title>
<!-- Мосты трёх площадок. MAX внедряет window.WebApp сам, поэтому скрипта нет. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
  /* Оформление в духе Telegram — сгруппированные списки. Палитра берётся
     из темы площадки (см. applyTheme), значения ниже — запасные. */
  :root { --bg:#efeff4; --card:#fff; --fg:#111; --muted:#7a7a7a; --hint:#8a8a8e;
          --accent:#2787f5; --ok:#1a9c4e; --bad:#d23; --wait:#e79a12; --line:#e3e3e7; --radius:12px; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#17212b; --card:#232e3c; --fg:#f5f5f5;
          --muted:#8a9099; --hint:#7d8b99; --line:#2b3947; } }
  * { box-sizing:border-box }
  html, body { max-width:100%; overflow-x:hidden }   /* никакой горизонтальной прокрутки */
  body { margin:0; font:15px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); padding:16px }
  .label b, .label span { overflow-wrap:anywhere }   /* длинные названия каналов не распирают строку */
  h1 { font-size:20px; margin:0 0 4px; font-weight:600 }
  h2 { font-size:17px; margin:0 0 10px; font-weight:600 }
  p.sub { color:var(--hint); margin:0 0 18px; font-size:14px }
  .group-title { font-size:13px; color:var(--hint); margin:20px 4px 7px; text-transform:uppercase; letter-spacing:.02em }

  /* Сгруппированный список: карточка, внутри строки с тонкими разделителями,
     отступ разделителя слева — как в настройках Telegram. */
  .group { background:var(--card); border-radius:var(--radius); overflow:hidden; margin-bottom:8px }
  .row { display:flex; align-items:center; gap:12px; padding:12px 14px; position:relative }
  .row + .row::before { content:''; position:absolute; left:14px; right:0; top:0; height:1px; background:var(--line) }
  .row.act + .row.act::before { left:14px }
  .icon { width:24px; height:24px; border-radius:50%; flex:0 0 24px; display:flex; align-items:center;
    justify-content:center; font-size:14px; background:var(--line); color:var(--muted) }
  .icon.ok{background:var(--ok);color:#fff} .icon.bad{background:var(--bad);color:#fff}
  .icon.wait{background:var(--wait);color:#fff} .icon.pend{background:var(--accent);color:#fff}
  .label { flex:1; min-width:0 } .label b { display:block; font-weight:400 }
  .label span { color:var(--hint); font-size:13px; display:block; margin-top:2px }

  /* Действие — строка с акцентным текстом, а не отдельная кнопка. */
  .row.act { color:var(--accent); cursor:pointer; text-decoration:none; font-size:15px }
  .row.act:active { background:rgba(127,127,127,.10) }
  .row.act .chev { color:var(--hint); font-size:17px; margin-left:auto; flex:0 0 auto }
  .row.act.done { color:var(--ok) }
  .manual { padding:10px 14px 12px; font-size:12px; color:var(--hint); background:var(--card) }
  .manual input { width:100%; margin-top:6px; padding:9px 10px; border:1px solid var(--line);
    border-radius:8px; background:var(--bg); color:var(--fg); font-size:12px; font-family:inherit }

  button, .btn { display:block; width:100%; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#fff;
    font-size:15px; font-weight:600; margin-top:10px; text-align:center; text-decoration:none; cursor:pointer; font-family:inherit }
  button:active,.btn:active{opacity:.85}
  button[disabled]{opacity:.45}
  .btn-sec { background:var(--card); color:var(--fg); border:1px solid var(--line) }
  .back { background:none; border:0; color:var(--accent); font-size:15px; padding:0 0 12px; width:auto; margin:0; text-align:left; font-weight:400 }

  #cat-search { margin-bottom:12px }
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:6px; -webkit-overflow-scrolling:touch }
  .chip { flex:0 0 auto; padding:8px 14px; border-radius:999px; background:var(--card); border:1px solid var(--line);
    font-size:13px; white-space:nowrap; cursor:pointer }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent) }

  .work { display:flex; align-items:center; gap:12px; padding:12px; background:var(--card); border-radius:12px; margin-bottom:10px; cursor:pointer }
  .work .thumb { width:64px; height:64px; flex:0 0 64px; border-radius:9px; background:var(--line);
    display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--muted) }
  .work .meta { flex:1; min-width:0 }
  .work .meta b { display:block; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .work .meta span { color:var(--muted); font-size:13px }
  /* Кнопка сбоку — голосовать не открывая карточку. width:auto перебивает
     общий button{width:100%}, иначе она растянулась бы на всю строку. */
  .vote-side { flex:0 0 auto; width:auto; padding:9px 14px; margin:0; font-size:13px; white-space:nowrap }
  .vote-badge { flex:0 0 auto; width:30px; height:30px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; font-size:15px; font-weight:700;
    padding:0; margin:0; border:0 }
  .vote-badge.ok { background:var(--ok); color:#fff; cursor:pointer }
  .vote-badge.ok:active { opacity:.8 }
  .vote-badge.off { color:var(--hint); font-size:12px; text-align:center; width:44px; background:none }

  .nom-row { display:flex; align-items:center; gap:10px; margin:9px 0; font-size:14px }
  .nom-row .n { flex:1 } .nom-row .c { color:var(--muted); font-size:13px; white-space:nowrap }
  .bar { height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:4px }
  .bar i { display:block; height:100%; background:var(--accent) }
  .bar.full i { background:var(--ok) }

  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px }
  input[type=text], textarea, select { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px;
    background:var(--bg); color:var(--fg); font-size:15px; font-family:inherit }
  textarea { min-height:80px; resize:vertical }
  .err { background:rgba(221,51,51,.12); color:var(--bad); padding:12px; border-radius:10px; margin-top:12px; font-size:14px }
  .okmsg { background:rgba(26,156,78,.12); color:var(--ok); padding:12px; border-radius:10px; margin-top:12px; font-size:14px }
  .note { font-size:12px; color:var(--muted); background:var(--card); border-radius:10px; padding:12px; margin-top:12px }
  #countdown { font-size:15px; font-weight:600; color:var(--accent); text-align:center;
    background:var(--card); border-radius:10px; padding:14px; margin:0 0 16px }
  .player { width:100%; aspect-ratio:16/9; border:0; border-radius:12px; background:#000; margin-bottom:12px }
  .empty { color:var(--muted); text-align:center; padding:28px 0; font-size:14px }
  .badge { display:inline-block; font-size:11px; color:var(--muted); border:1px solid var(--line);
    border-radius:6px; padding:2px 7px; margin-left:6px; vertical-align:middle }
  #log { margin-top:14px; font-size:11px; color:var(--muted); white-space:pre-wrap; word-break:break-word; opacity:.7 }
  .hide { display:none }
</style>
</head>
<body>

<div id="v-checks">
  <h1>Цех историй <span class="badge" id="plat"></span></h1>
  <p class="sub">Загрузка…</p>
  <div class="note hide" id="countdown"></div>
  <div class="err hide" id="gate-msg"></div>
  <div id="checks"></div>
  <div class="note hide" id="vk-note">
    Подписку на личную страницу ВКонтакте отражает с задержкой, поэтому её мы
    сверяем ещё раз при подведении итогов. Если вы подписаны — засчитаем.
  </div>
  <button id="to-catalog" class="btn-sec">Перейти к голосованию</button>
  <button id="to-submit" class="hide">Подать свою работу</button>
  <div id="log"></div>
</div>

<div id="v-catalog" class="hide">
  <button class="back" data-to="checks">← Назад</button>
  <h1>Работы конкурса</h1>
  <p class="sub" id="cat-count">Загрузка…</p>
  <input type="text" id="cat-search" placeholder="Поиск по названию и описанию" autocomplete="off">
  <div class="chips" id="chips"></div>
  <div id="works"></div>
  <button id="more" class="btn-sec hide">Показать ещё</button>
</div>

<div id="v-work" class="hide">
  <button class="back" data-to="catalog">← К списку</button>
  <div id="work-body"></div>
</div>

<div id="v-submit" class="hide">
  <button class="back" data-to="checks">← Назад</button>
  <h1>Подать работу</h1>
  <p class="sub">Видео должно быть загружено во ВКонтакте — укажите ссылку на него.</p>
  <div class="group-title">Свободные места</div>
  <div id="nom-progress"></div>
  <label for="f-nom">Номинация</label>
  <select id="f-nom"></select>
  <label for="f-title">Название работы</label>
  <input type="text" id="f-title" maxlength="200" placeholder="Например: Первый день на заводе">
  <label for="f-url">Ссылка на видео ВКонтакте</label>
  <input type="text" id="f-url" placeholder="https://vk.com/video-123456_789012">
  <label for="f-desc">Описание (необязательно)</label>
  <textarea id="f-desc" maxlength="2000" placeholder="Пара слов о вашей истории"></textarea>
  <button id="do-submit">Отправить работу</button>
  <div id="submit-msg"></div>
</div>

<script>
var API_V = '5.199';
var BACKEND = 'https://ef-server.tailfacff5.ts.net';
// Конкурс передаётся явно ?contest=N — без этого сервер каждый запрос
// разрешает самостоятельно как «первый по списку», и разные запросы
// (конфиг, работы, голос) могли бы молча разъехаться по разным конкурсам.
var CONTEST = new URLSearchParams(location.search).get('contest') || '';
// К адресу подмешивается &contest=N, если он задан; без него — пустая строка.
var CQ = CONTEST ? '&contest=' + encodeURIComponent(CONTEST) : '';
var CQ1 = CONTEST ? '?contest=' + encodeURIComponent(CONTEST) : '';

/* ================== адаптер площадки ==================
   Одно приложение на три сети. Различия спрятаны здесь,
   вся остальная логика и стили общие. */
var P = (function(){
  var tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined
        && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user;
  var mx = window.WebApp && window.WebApp.initDataUnsafe;   // MAX внедряет сам
  var vk = window.vkBridge;

  /** Цвета берём из темы хоста, чтобы приложение не спорило с оформлением. */
  function applyTheme(p){
    if(!p) return;
    var map = { bg_color:'--bg', secondary_bg_color:'--bg', section_bg_color:'--card',
      text_color:'--fg', hint_color:'--hint', subtitle_text_color:'--muted',
      link_color:'--accent', button_color:'--accent', section_separator_color:'--line' };
    var r = document.documentElement.style;
    // secondary_bg — фон экрана, section_bg — фон карточек; если второго нет,
    // карточку делаем из bg_color, иначе всё сольётся в одно пятно.
    if(p.secondary_bg_color) r.setProperty('--bg', p.secondary_bg_color);
    if(p.section_bg_color || p.bg_color) r.setProperty('--card', p.section_bg_color || p.bg_color);
    Object.keys(map).forEach(function(k){
      if(k==='bg_color'||k==='secondary_bg_color'||k==='section_bg_color') return;
      if(p[k]) r.setProperty(map[k], p[k]);
    });
  }

  if (tg) {
    var W = window.Telegram.WebApp;
    return {
      name: 'tg', title: 'Telegram',
      async init(){ try{ W.ready(); W.expand(); applyTheme(W.themeParams) }catch(e){} },
      async userId(){ return W.initDataUnsafe.user.id },
      canCheckVk: false,
      async copy(text){ try{ await navigator.clipboard.writeText(text); return true }catch(e){ return false } },
    };
  }
  if (mx) {
    var M = window.WebApp;
    return {
      name: 'max', title: 'MAX',
      async init(){},
      async userId(){ var u = M.initDataUnsafe && M.initDataUnsafe.user; return u && u.id },
      canCheckVk: false,
      async copy(text){ try{ await navigator.clipboard.writeText(text); return true }catch(e){ return false } },
    };
  }
  return {
    name: 'vk', title: 'ВКонтакте',
    async init(){ await vk.send('VKWebAppInit', {}) },
    async userId(){ var i = await vk.send('VKWebAppGetUserInfo', {}); return i.id },
    canCheckVk: true,
    async vkToken(appId){ var t = await vk.send('VKWebAppGetAuthToken', { app_id: Number(appId), scope: 'friends,groups' }); return t.access_token },
    async api(method, params){ return vk.send('VKWebAppCallAPIMethod', { method: method, params: params }) },
    async copy(text){
      try{ await vk.send('VKWebAppCopyText', { text: text }); return true }catch(e){}
      try{ await navigator.clipboard.writeText(text); return true }catch(e){ return false }
    },
  };
})();

var uid = null, sid = null, voterId = null;
var cfg = null, confirmed = {}, myVotes = [], admitted = false;
var noms = [], curNom = '', curQ = '', page = 1, loading = false, searchTimer = null;
var links = { maxUrl:null, tgUrl:null };

var $ = function(id){ return document.getElementById(id) };
function log(m){ $('log').textContent += m + '\n' }
function show(el, yes){ el.classList.toggle('hide', !yes) }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }
function showView(name){
  ['checks','catalog','work','submit'].forEach(function(v){ show($('v-'+v), v===name) });
  window.scrollTo(0,0);
}
Array.prototype.forEach.call(document.querySelectorAll('.back'), function(b){
  b.onclick = function(){ showView(b.dataset.to) };
});

/* ---------- экран проверок ---------- */
var BUCKET_TITLE = { vk:'ВКонтакте', max:'MAX', tg:'Telegram' };
function bucketOf(p){ return p==='max' ? 'max' : p==='tg' ? 'tg' : 'vk' }

function renderChecks(detail){
  var html = '';
  ['vk','max','tg'].forEach(function(b){
    var list = cfg.channels.filter(function(c){ return bucketOf(c.platform)===b });
    if(!list.length) return;
    var d = (detail && detail[b]) || null;
    var cap = BUCKET_TITLE[b];
    if(d && d.need) cap += ' · ' + d.have + ' из ' + d.need;
    html += '<div class="group-title">'+esc(cap)+'</div>';
    // Одна карточка на площадку: ссылка для подтверждения у всех её каналов
    // общая, поэтому блок действий показываем один раз, а не у каждой строки.
    html += '<div class="group">' +
      list.map(function(c){ return checkRow(c, b) }).join('') +
      bucketActions(b, list) + '</div>';
  });
  $('checks').innerHTML = html || '<div class="empty">Проверки не настроены</div>';
  Array.prototype.forEach.call($('checks').querySelectorAll('[data-copy]'), function(el){
    el.onclick = function(){ copyText(el.dataset.copy, el) };
  });
}

function statusRow(c, icon, cls, note){
  return '<div class="row"><div class="icon '+cls+'">'+icon+'</div>'+
    '<div class="label"><b>'+esc(c.title)+'</b><span>'+esc(note)+'</span></div></div>';
}
function actionRow(label, href, copyUrl){
  var chev = '<span class="chev">›</span>';
  if(href) return '<a class="row act" href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+chev+'</a>';
  return '<div class="row act" data-copy="'+esc(copyUrl)+'">'+esc(label)+'</div>';
}

function checkRow(c, b){
  if(confirmed[c.id]) return statusRow(c, '✓', 'ok', 'подтверждено');
  if(b==='vk'){
    // ВК проверяется токеном пользователя ВК; вне ВК его нет.
    if(!P.canCheckVk) return statusRow(c, '·', '', 'подтверждается в приложении ВКонтакте');
    return statusRow(c, c.required?'✗':'⏳', c.required?'bad':'wait',
      c.required ? 'подписка не найдена' : 'сверим при подведении итогов');
  }
  if(b===P.name) return statusRow(c, '·', '', 'подпишитесь и вернитесь сюда');
  return statusRow(c, '·', '', 'подпишитесь и нажмите «Старт» у бота');
}

/** Действия площадки — одним блоком внизу её карточки. */
function bucketActions(b, list){
  var allDone = list.every(function(c){ return confirmed[c.id] });
  if(allDone) return '';
  if(b === P.name) return '';                      // человек уже здесь
  var raw = b==='vk' ? cfg.vkAppUrl : b==='max' ? links.maxUrl : links.tgUrl;
  if(!raw) return '';
  var href = raw, label;
  if(b==='vk') label = 'Открыть во ВКонтакте';
  else if(b==='max') label = 'Перейти в MAX';
  else {
    label = 'Перейти в Telegram';
    var m = raw.match(/t\.me\/([^?]+)\?start=(.+)$/);
    if(m) href = 'tg://resolve?domain='+m[1]+'&start='+m[2];
  }
  return actionRow(label, href) + actionRow('Скопировать ссылку', null, raw) +
    '<div class="manual">Ссылка, если не открылась:'+
    '<input type="text" readonly value="'+esc(raw)+'" onclick="this.select()"></div>';
}

async function copyText(text, el){
  var done = await P.copy(text);
  if(done){
    var was = el.textContent;
    el.textContent = 'Скопировано'; el.classList.add('done');
    setTimeout(function(){ el.textContent = was; el.classList.remove('done') }, 1800);
  } else {
    var input = el.parentNode.querySelector('.manual input');
    if(input){ input.focus(); input.select() }
  }
}

/** Проверки ВК возможны только внутри ВК: нужен токен голосующего. */
async function checkVkChannels(){
  if(!P.canCheckVk) return [];
  var passed = [], soft = false;
  var access;
  try{ access = await P.vkToken(cfg.vkAppId) }catch(e){ log('токен ВК не выдан'); return [] }
  var groups = cfg.channels.filter(function(c){ return c.platform==='vk_group' });
  var pages  = cfg.channels.filter(function(c){ return c.platform==='vk_user' });
  for(var i=0;i<groups.length;i++){
    var c = groups[i];
    try{
      var mem = await P.api('groups.isMember', {group_id:c.ref, user_id:uid, access_token:access, v:API_V});
      if(mem.response===1||mem.response===true){ passed.push(c.id); confirmed[c.id]=true }
    }catch(e){}
  }
  if(pages.length){
    try{
      var subs = await P.api('users.getSubscriptions', {user_id:uid, count:200, access_token:access, v:API_V});
      var users=(subs.response&&subs.response.users&&subs.response.users.items)||[];
      pages.forEach(function(c){
        if(users.indexOf(Number(c.ref))>=0){ passed.push(c.id); confirmed[c.id]=true }
        else if(!c.required) soft = true;
      });
    }catch(e){ pages.forEach(function(c){ if(!c.required) soft = true }) }
  }
  show($('vk-note'), soft);
  return passed;
}

/* ---------- обратный отсчёт ---------- */
var countdownTimer = null;
function fmtDuration(ms){
  var s = Math.max(0, Math.floor(ms / 1000));
  var d = Math.floor(s / 86400); s -= d * 86400;
  var h = Math.floor(s / 3600); s -= h * 3600;
  var m = Math.floor(s / 60); s -= m * 60;
  var parts = [];
  if(d) parts.push(d + 'д');
  if(d || h) parts.push(h + 'ч');
  if(d || h || m) parts.push(m + 'м');
  parts.push(s + 'с');
  return parts.join(' ');
}
/** Отсчёт до ближайшего значимого момента — старта приёма работ или
 *  голосования. Обе даты — организаторские, наступают не каждую секунду,
 *  поэтому по истечении просто перезагружаем страницу, а не городим
 *  частичное обновление состояния. */
function renderCountdown(){
  clearInterval(countdownTimer);
  var el = $('countdown');
  var target = null, label = '';
  if(cfg && !cfg.submissionOpen && cfg.submissionNote === 'ещё не началось' && cfg.submissionStartsAt){
    target = cfg.submissionStartsAt; label = 'До начала приёма работ: ';
  } else if(cfg && !cfg.votingOpen && cfg.votingNote === 'ещё не началось' && cfg.votingStartsAt){
    target = cfg.votingStartsAt; label = 'До начала голосования: ';
  }
  if(!target){ show(el, false); return; }
  show(el, true);
  function tick(){
    var diff = target - Date.now();
    el.textContent = label + fmtDuration(diff);
    if(diff <= 0){ clearInterval(countdownTimer); location.reload(); }
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

/* ---------- гейт на голосование ---------- */
/** Почему нельзя голосовать прямо сейчас — если можно, вернёт null.
 *  Проверяется в двух местах (карточка работы и кнопка в списке), поэтому
 *  вынесено отдельно, а не продублировано. */
function voteBlockedReason(){
  if(!cfg) return 'closed';
  if(!cfg.votingOpen) return 'closed';
  if(!admitted) return 'not-admitted';
  return null;
}
/** Возврат на экран проверок с объяснением — как при незавершённых
 *  условиях участия, так и когда голосование ещё попросту не открылось:
 *  человек не должен листать карточки работ в ожидании открытия, ничего
 *  не понимая, а должен готовиться — подтверждать подписки. */
function bounceToChecks(reason){
  showView('checks');
  var el = $('gate-msg');
  if(reason === 'not-admitted'){
    el.textContent = 'Не все условия участия выполнены — подтвердите подписки ниже, чтобы голосовать.';
  } else if(cfg && cfg.votingNote === 'ещё не началось'){
    el.textContent = 'Голосование ещё не началось — подтвердите подписки, чтобы быть готовым.';
  } else if(cfg && cfg.votingNote === 'завершено'){
    el.textContent = 'Голосование завершено.';
  } else {
    el.textContent = 'Голосование сейчас недоступно.';
  }
  show(el, true);
  window.scrollTo(0, 0);
}

async function run(){
  try{
    cfg = await (await fetch(BACKEND+'/api/config'+CQ1)).json();
    document.title = cfg.title;
    $('v-checks').querySelector('h1').firstChild.textContent = cfg.title + ' ';
    $('plat').textContent = P.title;
    $('v-checks').querySelector('.sub').textContent = cfg.subtitle;
    renderChecks(null);
    renderCountdown();

    await P.init();
    uid = await P.userId();
    log('площадка: '+P.name+', id='+uid);

    var vkPassed = await checkVkChannels();

    var payload = { platform: P.name, vkChannels: vkPassed };
    if(P.name==='vk') payload.vkUserId = uid; else payload.extUserId = uid;
    if(CONTEST) payload.contestId = CONTEST;
    var r = await fetch(BACKEND+'/api/session',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)});
    var sess = await r.json();
    sid = sess.sid; voterId = sess.voterId;
    links = { maxUrl: sess.maxUrl, tgUrl: sess.tgUrl };
    log('сессия '+sid);
    await loadMyVotes();
    applyStatus(sess.status);
    poll();
  }catch(e){ log('ОШИБКА: '+(e && (e.message||e.name) ? (e.name+': '+e.message) : JSON.stringify(e))) }
}

function applyStatus(s){
  if(!s) return;
  (s.confirmed||[]).forEach(function(id){ confirmed[id]=true });
  renderChecks(s.detail);
  show($('to-submit'), !!s.completed && cfg.submissionOpen && P.name==='vk');
  if(s.completed && !admitted) loadMyVotes();
}

async function loadMyVotes(){
  if(!voterId) return;
  try{
    var r = await (await fetch(BACKEND+'/api/my-votes?voterId='+voterId+CQ)).json();
    myVotes = r.votes || []; admitted = !!r.admitted;
    if(admitted) show($('gate-msg'), false);
  }catch(e){}
}

async function poll(){
  if(!sid) return;
  try{
    var s = await (await fetch(BACKEND+'/api/status?sid='+sid)).json();
    if(s.voterId) voterId = s.voterId;
    applyStatus(s);
  }catch(e){}
  setTimeout(poll, 4000);
}

/* ---------- каталог ---------- */
async function loadNominations(){
  try{ noms = (await (await fetch(BACKEND+'/api/nominations'+CQ1)).json()).nominations || [] }catch(e){ noms = [] }
}
function renderChips(){
  var html = '<div class="chip'+(curNom===''?' on':'')+'" data-n="">Все</div>';
  noms.forEach(function(n){
    html += '<div class="chip'+(curNom===n.id?' on':'')+'" data-n="'+esc(n.id)+'">'+esc(n.title)+'</div>';
  });
  $('chips').innerHTML = html;
  Array.prototype.forEach.call($('chips').querySelectorAll('.chip'), function(c){
    c.onclick = function(){
      curNom = c.dataset.n; page = 1; $('works').innerHTML='';
      // Полный renderChips() тут не нужен и сбросил бы прокрутку чипов —
      // просто переносим подсветку на нажатый.
      Array.prototype.forEach.call($('chips').querySelectorAll('.chip'), function(x){ x.classList.remove('on') });
      c.classList.add('on');
      loadWorks();
    };
  });
}
async function loadWorks(){
  if(loading) return; loading = true;
  try{
    var url = BACKEND+'/api/works?page='+page+(curNom?'&nomination='+encodeURIComponent(curNom):'')+
      (curQ?'&q='+encodeURIComponent(curQ):'')+CQ;
    var r = await (await fetch(url)).json();
    var rows = r.rows || [];
    $('cat-count').textContent = r.total ? ('Всего работ: '+r.total) : '';
    if(page===1 && !rows.length){
      $('works').innerHTML = '<div class="empty">'+(curQ ? 'Ничего не найдено' : 'В этой номинации пока нет работ')+'</div>';
    } else {
      rows.forEach(function(w){
        var d = document.createElement('div');
        d.className = 'work';
        // Кнопка сбоку — голос без открытия карточки. Голосов уже отданных
        // за эту работу или занятых в номинации показываем значком, а не
        // кнопкой, чтобы не провоцировать повторную отправку.
        var votedThis = myVotes.some(function(v){ return v.work_id===w.id });
        var votedNom = myVotes.some(function(v){ return v.nomination_id===w.nomination_id });
        var side = '';
        if(cfg && cfg.votingOpen){
          if(votedThis) side = '<button type="button" class="vote-badge ok" title="Отменить голос">✓</button>';
          else if(votedNom) side = '<div class="vote-badge off">голос отдан</div>';
          else side = '<button type="button" class="vote-side btn-sec">Голосовать</button>';
        }
        d.innerHTML = '<div class="thumb">▶</div><div class="meta"><b>'+esc(w.title)+'</b>'+
          '<span>'+esc(w.nomination_title)+' · голосов: <span class="vcount">'+(w.votes||0)+'</span></span></div>'+side;
        d.onclick = function(){ openWork(w) };
        var vb = d.querySelector('.vote-side');
        if(vb) vb.onclick = function(e){ e.stopPropagation(); voteFromList(w, vb, d) };
        var vbadge = d.querySelector('.vote-badge.ok');
        if(vbadge) vbadge.onclick = function(e){ e.stopPropagation(); unvoteFromList(w, vbadge, d) };
        $('works').appendChild(d);
      });
    }
    show($('more'), rows.length >= 24);
  }catch(e){ $('works').innerHTML = '<div class="empty">Не удалось загрузить работы</div>' }
  loading = false;
}
$('more').onclick = function(){ page++; loadWorks() };
// Дебаунс — иначе каждая буква бьёт по серверу отдельным запросом.
$('cat-search').oninput = function(){
  var v = this.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){ curQ = v.trim(); page = 1; $('works').innerHTML=''; loadWorks() }, 350);
};

function openWork(w){
  // Не пускаем смотреть карточку работы, пока голосовать всё равно нельзя —
  // ни при неподтверждённых условиях участия, ни пока голосование ещё не
  // открылось (даже до старта конкурса). Ожидание должно вести к подтверждению
  // подписок, а не к бесцельному листанию карточек.
  var blocked = voteBlockedReason();
  if(blocked){ bounceToChecks(blocked); return; }
  var embed = 'https://vk.com/video_ext.php?oid='+w.video_owner_id+'&id='+w.video_id+'&hd=2';
  var votedThis = myVotes.some(function(v){ return v.work_id===w.id });
  var votedNom = myVotes.some(function(v){ return v.nomination_id===w.nomination_id });
  var voteBlock;
  // Сюда попадаем только когда голосование открыто и admitted — иначе
  // voteBlockedReason() развернул бы раньше.
  if(votedThis) voteBlock = '<div class="okmsg">Ваш голос за эту работу учтён ✓</div><button id="do-unvote" class="btn-sec">Отменить голос</button>';
  else if(votedNom) voteBlock = '<div class="note">В этой номинации вы уже отдали голос за другую работу.</div>';
  else voteBlock = '<button id="do-vote">Голосовать за эту работу</button>';

  $('work-body').innerHTML =
    '<iframe class="player" src="'+esc(embed)+'" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>'+
    '<h2>'+esc(w.title)+'</h2>'+
    '<p class="sub">'+esc(w.nomination_title)+' · голосов: '+(w.votes||0)+'</p>'+
    (w.description ? '<p>'+esc(w.description)+'</p>' : '')+
    voteBlock + '<div id="vote-msg"></div>'+
    '<a class="btn btn-sec" href="'+esc(w.video_url)+'" target="_blank" rel="noopener">Открыть видео во ВКонтакте</a>';
  var vb = $('do-vote');
  if(vb) vb.onclick = function(){ castVote(w, vb) };
  var uvb = $('do-unvote');
  if(uvb) uvb.onclick = function(){ castUnvote(w, uvb) };
  showView('work');
}

async function castVote(w, btn){
  btn.disabled = true; btn.textContent = 'Отправляем…';
  try{
    var res = await (await fetch(BACKEND+'/api/vote',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ workId: w.id, voterId: voterId, sid: sid })})).json();
    if(res.ok){
      myVotes.push({ work_id: w.id, nomination_id: w.nomination_id });
      w.votes = (w.votes||0) + 1;
      openWork(w);
      page = 1; $('works').innerHTML=''; loadWorks();
    } else {
      btn.disabled = false; btn.textContent = 'Голосовать за эту работу';
      $('vote-msg').innerHTML = '<div class="err">'+esc(res.error || 'Не удалось отдать голос')+'</div>';
    }
  }catch(e){
    btn.disabled = false; btn.textContent = 'Голосовать за эту работу';
    $('vote-msg').innerHTML = '<div class="err">Нет связи с сервером. Попробуйте ещё раз.</div>';
  }
}

async function castUnvote(w, btn){
  btn.disabled = true; btn.textContent = 'Отменяем…';
  try{
    var res = await (await fetch(BACKEND+'/api/unvote',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ workId: w.id, voterId: voterId })})).json();
    if(res.ok){
      myVotes = myVotes.filter(function(v){ return v.work_id !== w.id });
      w.votes = Math.max(0, (w.votes||0) - 1);
      openWork(w);
      page = 1; $('works').innerHTML=''; loadWorks();
    } else {
      btn.disabled = false; btn.textContent = 'Отменить голос';
      $('vote-msg').innerHTML = '<div class="err">'+esc(res.error || 'Не удалось отменить голос')+'</div>';
    }
  }catch(e){
    btn.disabled = false; btn.textContent = 'Отменить голос';
    $('vote-msg').innerHTML = '<div class="err">Нет связи с сервером. Попробуйте ещё раз.</div>';
  }
}

/** Тот же голос, но с кнопки в списке — без перехода в карточку работы.
 *  Ошибку показываем прямо на кнопке (своего места под сообщение в строке
 *  списка нет), через 2 секунды текст возвращается обратно. */
async function voteFromList(w, btn, rowEl){
  var blocked = voteBlockedReason();
  if(blocked){ bounceToChecks(blocked); return; }
  var was = btn.textContent;
  btn.disabled = true; btn.textContent = '…';
  try{
    var res = await (await fetch(BACKEND+'/api/vote',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ workId: w.id, voterId: voterId, sid: sid })})).json();
    if(res.ok){
      myVotes.push({ work_id: w.id, nomination_id: w.nomination_id });
      w.votes = (w.votes||0) + 1;
      var vc = rowEl.querySelector('.vcount'); if(vc) vc.textContent = w.votes;
      btn.outerHTML = '<button type="button" class="vote-badge ok" title="Отменить голос">✓</button>';
      var vbadge = rowEl.querySelector('.vote-badge.ok');
      if(vbadge) vbadge.onclick = function(e){ e.stopPropagation(); unvoteFromList(w, vbadge, rowEl) };
    } else {
      // Полный текст ошибки сервера сюда не помещается — узкая кнопка в
      // строке списка, а не карточка. Подробности при желании увидят
      // открыв работу целиком.
      btn.disabled = false; btn.textContent = 'Не удалось';
      setTimeout(function(){ btn.disabled = false; btn.textContent = was }, 2000);
    }
  }catch(e){
    btn.disabled = false; btn.textContent = 'Нет связи';
    setTimeout(function(){ btn.disabled = false; btn.textContent = was }, 2000);
  }
}

/** Отмена голоса прямо из списка — зеркало voteFromList(). Кнопку возвращаем
 *  в исходное состояние «Голосовать»: место в номинации освободилось. */
async function unvoteFromList(w, btn, rowEl){
  btn.disabled = true;
  try{
    var res = await (await fetch(BACKEND+'/api/unvote',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ workId: w.id, voterId: voterId })})).json();
    if(res.ok){
      myVotes = myVotes.filter(function(v){ return v.work_id !== w.id });
      w.votes = Math.max(0, (w.votes||0) - 1);
      var vc = rowEl.querySelector('.vcount'); if(vc) vc.textContent = w.votes;
      btn.outerHTML = '<button type="button" class="vote-side btn-sec">Голосовать</button>';
      var vb = rowEl.querySelector('.vote-side');
      if(vb) vb.onclick = function(e){ e.stopPropagation(); voteFromList(w, vb, rowEl) };
    } else {
      btn.disabled = false;
    }
  }catch(e){
    btn.disabled = false;
  }
}

/* ---------- подача работы ---------- */
function renderSubmitForm(){
  var prog = '', opts = '';
  noms.forEach(function(n){
    var pct = Math.round(100 * n.taken / n.max_works);
    prog += '<div><div class="nom-row"><span class="n">'+esc(n.title)+'</span>'+
      '<span class="c">'+n.taken+'/'+n.max_works+'</span></div>'+
      '<div class="bar'+(n.full?' full':'')+'"><i style="width:'+pct+'%"></i></div></div>';
    opts += '<option value="'+esc(n.id)+'"'+(n.full?' disabled':'')+'>'+esc(n.title)+
      (n.full?' — мест нет':' — свободно '+n.free)+'</option>';
  });
  $('nom-progress').innerHTML = prog;
  $('f-nom').innerHTML = opts;
}

$('do-submit').onclick = async function(){
  var btn = this; $('submit-msg').innerHTML = '';
  btn.disabled = true; btn.textContent = 'Отправляем…';
  try{
    var res = await (await fetch(BACKEND+'/api/works', {method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ vkUserId: uid, nominationId: $('f-nom').value, title: $('f-title').value,
                             videoUrl: $('f-url').value, description: $('f-desc').value,
                             contestId: CONTEST || undefined })})).json();
    if(res.ok){
      $('submit-msg').innerHTML = '<div class="okmsg">Работа отправлена'+
        (res.moderated ? ' и появится в каталоге после проверки организаторами' : '')+
        '. Занято мест: '+res.taken+' из '+res.max+'.</div>';
      $('f-title').value=''; $('f-url').value=''; $('f-desc').value='';
      await loadNominations(); renderSubmitForm();
    } else {
      $('submit-msg').innerHTML = '<div class="err">'+esc(res.error || 'Не удалось отправить работу')+'</div>';
    }
  }catch(e){ $('submit-msg').innerHTML = '<div class="err">Нет связи с сервером. Попробуйте ещё раз.</div>' }
  btn.disabled = false; btn.textContent = 'Отправить работу';
};

$('to-catalog').onclick = async function(){
  showView('catalog');
  if(!noms.length) await loadNominations();
  renderChips();
  if(!$('works').children.length) loadWorks();
};
$('to-submit').onclick = async function(){
  showView('submit');
  if(!noms.length) await loadNominations();
  renderSubmitForm();
};

run();
</script>
